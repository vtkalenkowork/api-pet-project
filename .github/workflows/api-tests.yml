name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test project
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkout user-api
        uses: actions/checkout@v4
        with:
          repository: vtkalenkowork/user-api-service
          path: user-api

      - name: Checkout auth-service
        uses: actions/checkout@v4
        with:
          repository: vtkalenkowork/auth-service
          path: auth-service

      - name: Build user-api
        run: mvn -f user-api/pom.xml clean package -DskipTests

      - name: Build auth-service
        run: mvn -f auth-service/pom.xml clean package -DskipTests

      - name: Build Docker images
        run: |
          docker build -t user-api:latest ./user-api
          docker build -t auth-service:latest ./auth-service

      - name: Start backend services
        run: docker compose up -d

      - name: Run API tests
        run: mvn clean test

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Stop backend services
        if: always()
        run: docker compose down