name: API Tests

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test project
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Checkout user-api
        uses: actions/checkout@v4
        with:
          repository: vtkalenkowork/user-api-service
          path: user-api

      - name: Checkout auth-service
        uses: actions/checkout@v4
        with:
          repository: vtkalenkowork/auth-service
          path: auth-service

      - name: Build user-api
        run: mvn -f user-api/pom.xml clean package -DskipTests

      - name: Build auth-service
        run: mvn -f auth-service/pom.xml clean package -DskipTests

      - name: Build Docker images
        run: |
          docker build -t user-api:latest ./user-api
          docker build -t auth-service:latest ./auth-service

      - name: Start backend services
        run: docker compose up -d

      - name: Run API tests
        run: mvn clean test

      - name: Install Allure
        if: always()
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.42.0/allure-2.42.0.tgz
          tar -zxvf allure.tgz
          sudo mv allure-2.42.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Stop backend services
        if: always()
        run: docker compose down